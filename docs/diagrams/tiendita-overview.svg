        <title id="tiendita-overview-title">Arquitectura general de Tiendita</title>
        <desc id="tiendita-overview-desc">Mapa completo de la arquitectura de Tiendita: Navegador con React y Vercel, FastAPI y reglas de negocio en Python, Neon Auth, PostgreSQL en Neon, y el flujo de ingeniería con Terminal, Git y GitHub Actions.</desc>
