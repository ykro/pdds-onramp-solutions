<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura en capas del backend</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:       #F7F6F2;
      --paper-2:     #EFECE6;
      --ink:         #0F2547;
      --muted:       #3B5B8C;
      --soft:        #5C769E;
      --rule:        rgba(15,37,71,0.12);
      --rule-solid:  #B8C4D6;
      --accent:      #C59216;
      --accent-tint: rgba(197,146,22,0.10);
      --link:        #2E5AA8;
      --font-sans:   'Geist', system-ui, sans-serif;
      --font-serif:  'Instrument Serif', Georgia, serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">PILA DE CAPAS · PASO 4 · API Y AUTENTICACIÓN</p>
    <h1>Separación de responsabilidades en el backend de Tiendita</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="step4-layers-title step4-layers-desc">
        <title id="step4-layers-title">Arquitectura en capas del backend</title>
        <desc id="step4-layers-desc">Pila de cuatro capas del backend de Tiendita desde las rutas HTTP en FastAPI hasta los servicios de negocio, los repositorios SQL y PostgreSQL.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C59216"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E5AA8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#F7F6F2"/>
        <line x1="88" y1="76" x2="88" y2="344" stroke="#3B5B8C" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="88" y="64" fill="#5C769E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PETICIÓN</text>
        <text x="88" y="362" fill="#5C769E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">DATOS</text>
        <rect x="148" y="60" width="768" height="304" rx="6" fill="#FFFFFF" stroke="#B8C4D6" stroke-width="1.2"/>
        <rect x="148" y="60" width="768" height="76" rx="6" fill="rgba(197,146,22,0.10)" stroke="#C59216" stroke-width="1.4"/>
        <text x="172" y="102" fill="#C59216" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L1 · HTTP</text>
        <text x="336" y="104" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Rutas HTTP (FastAPI)</text>
        <text x="892" y="102" fill="#0F2547" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">routes/*.py · Pydantic · status codes</text>
        <rect x="149" y="137" width="766" height="74" fill="#EFECE6"/>
        <line x1="148" y1="136" x2="916" y2="136" stroke="rgba(15,37,71,0.12)" stroke-width="1"/>
        <text x="172" y="178" fill="#5C769E" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L2 · DOMINIO</text>
        <text x="336" y="180" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Servicios de negocio</text>
        <text x="892" y="178" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">services/*.py · reglas · validaciones</text>
        <rect x="149" y="213" width="766" height="74" fill="#FFFFFF"/>
        <line x1="148" y1="212" x2="916" y2="212" stroke="rgba(15,37,71,0.12)" stroke-width="1"/>
        <text x="172" y="254" fill="#5C769E" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L3 · DATOS</text>
        <text x="336" y="256" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Repositorios SQL</text>
        <text x="892" y="254" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">repositories/*.py · consultas parametrizadas</text>
        <rect x="149" y="289" width="766" height="74" fill="#EFECE6"/>
        <line x1="148" y1="288" x2="916" y2="288" stroke="rgba(15,37,71,0.12)" stroke-width="1"/>
        <text x="172" y="330" fill="#5C769E" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L4 · STORAGE</text>
        <text x="336" y="332" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">PostgreSQL / Neon</text>
        <text x="892" y="330" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">tablas · constraints · transacciones ACID</text>
        <line x1="32" y1="404" x2="928" y2="404" stroke="rgba(15,37,71,0.12)" stroke-width="0.8"/>
        <text x="32" y="420" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <rect x="120" y="411" width="16" height="12" rx="2" fill="rgba(197,146,22,0.10)" stroke="#C59216" stroke-width="1.2"/>
        <text x="144" y="420" fill="#3B5B8C" font-size="9" font-family="'Geist', sans-serif">Capa expuesta por la API</text>
        <rect x="316" y="411" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#B8C4D6" stroke-width="1"/>
        <text x="340" y="420" fill="#3B5B8C" font-size="9" font-family="'Geist', sans-serif">Capa interna del backend</text>
        <line x1="512" y1="417" x2="530" y2="417" stroke="#3B5B8C" stroke-width="1.4"/>
        <text x="536" y="420" fill="#3B5B8C" font-size="9" font-family="'Geist', sans-serif">Dirección de dependencia (arriba hacia abajo)</text>
      </svg>
    </div>
  </div>
</body>
</html>
