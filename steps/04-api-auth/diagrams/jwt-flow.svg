<svg viewBox="0 0 960 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="step4-jwt-flow-title step4-jwt-flow-desc" id="step4-jwt-flow-root">
        <title id="step4-jwt-flow-title">Flujo de autenticación JWT y JWKS</title>
        <desc id="step4-jwt-flow-desc">Secuencia de autenticación entre Cliente, proveedor Auth/JWKS, FastAPI con PyJWT y el Servicio que valida user_id, con bifurcación ALT entre respuesta 200 y rechazo 401.</desc>
