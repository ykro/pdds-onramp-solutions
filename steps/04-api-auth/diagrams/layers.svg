        <text x="336" y="256" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Repositorios SQL</text>
        <text x="892" y="254" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">repositories/*.py · consultas parametrizadas</text>
        <rect x="149" y="289" width="766" height="74" fill="#EFECE6"/>
        <line x1="148" y1="288" x2="916" y2="288" stroke="#0f2547" stroke-opacity="0.12" stroke-width="1"/>
        <text x="172" y="330" fill="#5C769E" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L4 · STORAGE</text>
        <text x="336" y="332" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">PostgreSQL / Neon</text>
        <text x="892" y="330" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">tablas · constraints · transacciones ACID</text>
        <line x1="32" y1="404" x2="928" y2="404" stroke="#0f2547" stroke-opacity="0.12" stroke-width="0.8"/>
        <text x="32" y="420" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
        <rect x="120" y="411" width="16" height="12" rx="2" fill="#c59216" fill-opacity="0.10" stroke="#C59216" stroke-width="1.2"/>
        <text x="144" y="420" fill="#3B5B8C" font-size="9" font-family="'Geist', sans-serif">Capa expuesta por la API</text>
        <rect x="316" y="411" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#B8C4D6" stroke-width="1"/>
        <text x="340" y="420" fill="#3B5B8C" font-size="9" font-family="'Geist', sans-serif">Capa interna del backend</text>
        <line x1="512" y1="417" x2="530" y2="417" stroke="#3B5B8C" stroke-width="1.4"/>
        <text x="536" y="420" fill="#3B5B8C" font-size="9" font-family="'Geist', sans-serif">Dirección de dependencia (arriba hacia abajo)</text>
      </svg>
