<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="step4-layers-title step4-layers-desc" id="step4-layers-root">
        <title id="step4-layers-title">Arquitectura en capas del backend</title>
        <desc id="step4-layers-desc">Pila de cuatro capas del backend de Tiendita desde las rutas HTTP en FastAPI hasta los servicios de negocio, los repositorios SQL y PostgreSQL.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #step4-layers-root { --paper:       #F7F6F2;
      --paper-2:     #EFECE6;
      --ink:         #0F2547;
      --muted:       #3B5B8C;
      --soft:        #5C769E;
      --rule:        rgba(15,37,71,0.12);
      --rule-solid:  #B8C4D6;
      --accent:      #C59216;
      --accent-tint: rgba(197,146,22,0.10);
      --link:        #2E5AA8;
      --font-sans:   'Geist', system-ui, sans-serif;
      --font-serif:  'Instrument Serif', Georgia, serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace; }
      #step4-layers-root { font-family: var(--font-sans); color: var(--ink); }
      #step4-layers-root .diagram-container { width: 100%; overflow-x: auto; }
      #step4-layers-root .diagram-container { overflow-x: visible; }</style>
          <marker id="step4-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/></marker>
          <marker id="step4-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C59216"/></marker>
          <marker id="step4-layers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2E5AA8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#F7F6F2"/>
        <line x1="88" y1="76" x2="88" y2="344" stroke="#3B5B8C" stroke-width="1.3" marker-end="url(#step4-layers-arrow)"/>
        <text x="88" y="64" fill="#5C769E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PETICIÓN</text>
        <text x="88" y="362" fill="#5C769E" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">DATOS</text>
        <rect x="148" y="60" width="768" height="304" rx="6" fill="#FFFFFF" stroke="#B8C4D6" stroke-width="1.2"/>
        <rect x="148" y="60" width="768" height="76" rx="6" fill="#c59216" fill-opacity="0.10" stroke="#C59216" stroke-width="1.4"/>
        <text x="172" y="102" fill="#C59216" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L1 · HTTP</text>
        <text x="336" y="104" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Rutas HTTP (FastAPI)</text>
        <text x="892" y="102" fill="#0F2547" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">api/app.py · Pydantic · status codes</text>
        <rect x="149" y="137" width="766" height="74" fill="#EFECE6"/>
        <line x1="148" y1="136" x2="916" y2="136" stroke="#0f2547" stroke-opacity="0.12" stroke-width="1"/>
        <text x="172" y="178" fill="#5C769E" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L2 · DOMINIO</text>
        <text x="336" y="180" fill="#0F2547" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Servicios de negocio</text>
        <text x="892" y="178" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">services/*.py · reglas · validaciones</text>
        <rect x="149" y="213" width="766" height="74" fill="#FFFFFF"/>
        <line x1="148" y1="212" x2="916" y2="212" stroke="#0f2547" stroke-opacity="0.12" stroke-width="1"/>
