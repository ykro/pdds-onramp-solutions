<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="step2-order-states-title step2-order-states-desc" id="step2-order-states-root">
        <title id="step2-order-states-title">Máquina de estados de órdenes</title>
        <desc id="step2-order-states-desc">Máquina de estados de una orden en Tiendita con el flujo principal pending, paid, shipped y delivered, y cancelación permitida únicamente desde pending o paid.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #step2-order-states-root { --paper:       #F7F6F2;
      --paper-2:     #EFECE6;
      --ink:         #0F2547;
      --muted:       #3B5B8C;
      --soft:        #5C769E;
      --rule:        rgba(15,37,71,0.12);
      --rule-solid:  #B8C4D6;
      --accent:      #C59216;
      --accent-tint: rgba(197,146,22,0.10);
      --link:        #2E5AA8;
      --font-sans:   'Geist', system-ui, sans-serif;
      --font-serif:  'Instrument Serif', Georgia, serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace; }
      #step2-order-states-root { font-family: var(--font-sans); color: var(--ink); }
      #step2-order-states-root .diagram-container { width: 100%; overflow-x: auto; }
      #step2-order-states-root .diagram-container { overflow-x: visible; }</style>
