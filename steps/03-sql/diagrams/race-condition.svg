<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="step3-race-condition-title step3-race-condition-desc" id="step3-race-condition-root">
        <title id="step3-race-condition-title">Control de concurrencia con SELECT FOR UPDATE</title>
        <desc id="step3-race-condition-desc">Diagrama de secuencia que muestra dos compras simultáneas de la última unidad en PostgreSQL: SELECT ... FOR UPDATE serializa el acceso para que Compra A confirme y Compra B haga rollback.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #step3-race-condition-root { --paper:       #F7F6F2;
      --paper-2:     #EFECE6;
      --ink:         #0F2547;
      --muted:       #3B5B8C;
      --soft:        #5C769E;
      --rule:        rgba(15,37,71,0.12);
      --rule-solid:  #B8C4D6;
      --accent:      #C59216;
      --accent-tint: rgba(197,146,22,0.10);
      --link:        #2E5AA8;
      --font-sans:   'Geist', system-ui, sans-serif;
      --font-serif:  'Instrument Serif', Georgia, serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace; }
      #step3-race-condition-root { font-family: var(--font-sans); color: var(--ink); }
      #step3-race-condition-root .diagram-container { width: 100%; overflow-x: auto; }
      #step3-race-condition-root .diagram-container { overflow-x: visible; }</style>
