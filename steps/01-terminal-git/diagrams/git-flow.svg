<svg viewBox="0 0 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="step1-git-flow-title step1-git-flow-desc" id="step1-git-flow-root">
        <title id="step1-git-flow-title">Flujo de trabajo en Git con CI</title>
        <desc id="step1-git-flow-desc">Proceso secuencial de siete pasos desde la creación de una rama y commits locales hasta push, verificación en CI, Pull Request, revisión y merge a main.</desc>
