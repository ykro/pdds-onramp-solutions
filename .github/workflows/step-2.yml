name: Paso 2 - Reglas de negocio y algoritmos

on:
  push:
  pull_request:

jobs:
  step-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check backend/tiendita/pricing.py backend/tiendita/catalog.py backend/tiendita/search.py backend/tests/step2
      - run: uv run pytest backend/tests/step2 -v
