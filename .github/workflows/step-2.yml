name: Step 2 - Reglas y algoritmos

on:
  push:
  pull_request:

jobs:
  step-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check backend/tiendita
      - run: uv run pytest backend/tests/step2 -m "not extra and not prod" -v
