name: Paso 5 - React y TypeScript

on:
  push:
  pull_request:

jobs:
  step-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

      - name: Security audit (informational, non-blocking)
        continue-on-error: true
        run: cd frontend && npm audit --audit-level=high

      - name: Production smoke test (runs when deploy.json has app_url)
        run: |
          APP_URL=$(python3 -c 'import json; print((json.load(open("deploy.json")).get("app_url") or "").strip())')
          if [ -n "$APP_URL" ]; then
            pip install httpx pytest
            pytest backend/tests/step5/test_prod_deploy.py -v
          else
            echo "deploy.json sin app_url todavía; el deploy es opcional y se omite la prueba de producción."
          fi
