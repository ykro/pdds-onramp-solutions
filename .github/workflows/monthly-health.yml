name: Monthly Solutions Health Check

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  full-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiendita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tiendita
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: cd frontend && npm ci
      - run: uv run pytest backend/tests/step1 backend/tests/step2 backend/tests/step3 backend/tests/step4 -m "not prod" -v
      - run: cd frontend && npx tsc --noEmit && npm test && npm run build
      - run: uv run pip-audit
      - run: cd frontend && npm audit --audit-level=high
      - run: uv run python scripts/verify_template.py --solutions-only
