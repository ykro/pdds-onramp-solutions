name: Initialize Repo

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README badges to this repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          repo = os.environ["GITHUB_REPOSITORY"]
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          updated = text.replace("ykro/pdds-onramp/", f"{repo}/")
          if updated != text:
              readme.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update badges for ${{ github.repository }}"
            git push
          fi

      - name: Create backlog issues (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state all --limit 50 --json title --jq '.[].title')
          create_if_missing() {
            local title="$1"
            local body="$2"
            if ! printf '%s\n' "$existing" | grep -Fxq "$title"; then
              gh issue create --title "$title" --body "$body"
            fi
          }
          create_if_missing "Paso 1: Terminal, Git y flujo de trabajo" "Ver steps/01-terminal-git/README.md (CA-1.1 a CA-1.3)."
          create_if_missing "Paso 2: Reglas de negocio y algoritmos" "Ver steps/02-rules-algorithms/README.md (CA-2.1 a CA-2.3)."
          create_if_missing "Paso 3: SQL, modelado y seguridad de consultas" "Ver steps/03-sql/README.md (CA-3.1 a CA-3.3)."
          create_if_missing "Paso 4: API REST, capas y autorización" "Ver steps/04-api-auth/README.md (CA-4.1 a CA-4.4)."
          create_if_missing "Paso 5: React y TypeScript" "Ver steps/05-react-deploy/README.md (CA-5.1 a CA-5.3)."
