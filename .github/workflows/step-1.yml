name: Step 1 - Terminal y Git

on:
  push:
  pull_request:

jobs:
  step-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest backend/tests/step1 -m "not extra and not prod" -v
