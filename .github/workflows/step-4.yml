name: Paso 4 - API REST, capas y autorización

on:
  push:
  pull_request:

jobs:
  step-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest backend/tests/step4 -v
