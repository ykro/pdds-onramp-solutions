[project]
name = "tiendita"
version = "0.1.0"
description = "Tiendita backend for pdds-onramp"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT[crypto]>=2.10.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tiendita"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
markers = [
    "extra: extended acceptance criteria (run with EXTRA=1)",
    "db: tests that require PostgreSQL",
    "prod: production deployment smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
